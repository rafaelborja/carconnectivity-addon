[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cruise-search-mcp"
version = "0.1.0"
description = "MCP server aggregating validated public cruise search sources"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastmcp>=2.10",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
cruise-search-mcp = "cruise_search_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cruise_search_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
